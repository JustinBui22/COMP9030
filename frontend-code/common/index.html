<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/framework.css">
    <title>Unified Framework</title>
</head>
<body>
    <!-- Header -->
    <div id="header">
        <!-- Placeholder for Logo -->
        <div class="placeholder">L</div>
        <!-- User avatar placeholder -->
        <div class="user-profile">
            <span class="user-name">Welcome, <span id="username"></span></span>
            <div class="placeholder" id="user-avatar" onclick="toggleDropdown()">U</div>
            
            <!-- Dropdown for user actions -->
            <div id="user-dropdown" class="dropdown">
                <button onclick="openEditProfile()">Edit Profile</button>
                <button onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="editProfileModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeEditProfile()">&times;</span>
            <h2>Edit Profile</h2>
            <form id="editProfileForm">
                <label for="username">Username:</label>
                <input type="text" id="editUsername" name="username" required>
                
                <label for="email">Email:</label>
                <input type="email" id="editEmail" name="email" required>

                <button type="submit">Save Changes</button>
            </form>
        </div>
    </div>

    <!-- Layout for sidebar and content -->
<div id="layout">
    <!-- Sidebar (with collapse/expand button inside) -->
    <div id="sidebar">
        <!-- Collapsible Sidebar Button at the right top corner -->
        <button id="collapse-button" onclick="toggleSidebar()">☰</button>
        <nav>
            <ul id="nav-list">
                <!-- Links will be dynamically populated based on role -->
            </ul>
        </nav>
    </div>

    <!-- Content Area with Iframe -->
    <div id="content">
        <iframe id="content-frame" name="content-frame"></iframe>
    </div>
</div>

    <script src="scripts/framework.js"></script> <!-- Link to external JS -->
</body>
</html>
