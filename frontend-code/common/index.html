<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="common/styles/common.css">
    <link rel="stylesheet" href="styles/framework.css"> <!-- Separate CSS for framework -->
    <title>Unified Framework</title>
</head>
<body>
    <!-- Header -->
    <div id="header">
        <!-- Placeholder for Logo -->
        <div class="placeholder">L</div>

        <!-- User avatar placeholder -->
        <div class="user-profile">
            <span class="user-name">Welcome, <span id="username"></span></span>
            <div class="placeholder">U</div>
        </div>
    </div>

    <!-- Layout for sidebar and content -->
    <div id="layout">
        <!-- Sidebar (to be populated based on role) -->
        <div id="sidebar">
            <nav>
                <ul id="nav-list">
                    <!-- Items will be dynamically populated based on role -->
                </ul>
            </nav>
        </div>

        <!-- Content Area with Iframe -->
        <div id="content">
            <iframe id="content-frame" name="content-frame"></iframe>
        </div>
    </div>

    <script src="scripts/framework.js"></script> <!-- Link to external JS -->
</body>
</html>
