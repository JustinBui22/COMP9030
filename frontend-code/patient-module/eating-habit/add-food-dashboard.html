<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Justin Bui">
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles/style.css"> <!-- Link to your CSS file -->
</head>



<body>
    <!-- Navigation Bar -->
    <header>
        <nav class="navbar">
            <div class="logo">
                <h1>EatingHabitPal</h1>
            </div>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="food-log-dashboard.html">Log Food</a></li>
                <li><a href="add-exercise-dashboard.html">Exercise Library</a></li>
                <li><a href="add-food-dashboard.html">Food Library</a></li>
                <li><a href="#">Progress</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Dashboard Content -->
    <main class="dashboard">
        <!-- Summary Section -->
        <section>
            <div class="search-bar">
                <form action="/search" method="get">
                    <input type="search" name="query" placeholder="Search for an food" required>
                    <input type="submit" value="Search">
                </form>
            </div>

                <div class="nutrient-info">
                    <h3>History of Food:</h3>

                    <table class="add-items-tables">
                        <thead>
                            <tr>
                                <th>Food</th>
                                <th>Calories intake</th>
                             
                            </tr>
                        </thead>

                        <tbody>
                            <tr class="calo-info-row">
                                <td>Chocolate Protein Poweder</td>
                                <td rowspan="2">78</td>
                            </tr>
                            <tr class="calo-info-even-row">
                                <td>
                                    <table class="add-item-row">
                                        <tr>
                                            <td>Body Science, 20 grams</td>
                                            <td class="add-item-button">
                                                <button><a href="food-log-dashboard.html">Add food</a></button>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                            <tr class="calo-info-row">
                                <td>Pepperoni pizza</td>
                                <td rowspan="2">255</td>
                            </tr>
                            <tr class="calo-info-even-row">
                                <td>
                                    <table class="add-item-row">
                                        <tr>
                                            <td>1 Medium Slice</td>
                                            <td class="add-item-button">
                                                <button><a href="food-log-dashboard.html">Add food</a></button>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                        </tbody>
                    </table>

                    
                </div> 
         
        </section>

        <div class="complete-day-dairy-container">
            <input type="submit" id="complete-day-dairy-button" class="complete-day-dairy-button" value="Back" onclick="location.href='home.html';">
        </div>  
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 EatingHabitPal. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script> <!-- Link to your JavaScript file -->
</body>
</html>
