<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep Duration</title>
    <link rel="stylesheet" href="Manual-Entry/Styles/style.css">
</head>
<body>
    <div class="container">
        <h1>Enter Sleep Duration</h1>
        <form id="manualEntry">
            <label for="hours">Hours:</label>
            <input type="number" id="hours"  min="0" name="hours" required>
            
            <label for="minutes">Minutes:</label>
            <input type="number" id="minutes" name="minutes"  max="59" min="0" required>
            
            <div class="form-buttons">
                <button type="button" onclick="closeForm()">Cancel</button> <!-- Cancel Button -->
                <button type="submit" onclick="addEntry()">Add</button> <!-- Add Entry Button -->

            </div>
        </form>
    </div>
    <script src="Manual-Entry/Scripts/script.js"></script>
</body>
</html>
