<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise Tracker</title>
    <link rel="stylesheet" href="styles/Patient.css">
</head>
<body>
    <div class="container">
        <h1>Exercise Tracker</h1>
        <div class="form-group">
            <label for="patientName">Patient Name:</label>
            <input type="text" id="patientName" placeholder="Enter Patient Name">
        </div>
        <div class="form-group">
            <label for="patientID">Patient ID:</label>
            <input type="text" id="patientID" placeholder="Enter Patient ID">
        </div>

        <div class="table-container">
            <div class="table-column">
                <h3>Exercise Details</h3>
                <div class="form-group">
                    <label for="exerciseDate">Date:</label>
                    <input type="date" id="exerciseDate">
                </div>
                <table>
                    <tr>
                        <th>Activity</th>
                        <th>Hours</th>
                    </tr>
                    <tr>
                        <td>Running</td>
                        <td><input type="number" min="0"></td>
                    </tr>
                    <tr>
                        <td>Cycling</td>
                        <td><input type="number" min="0"></td>
                    </tr>
                    <tr>
                        <td>Others</td>
                        <td><input type="number" min="0"></td>
                    </tr>
                </table>
            </div>
            <div class="table-column">
                <h3>Weekly Records Review (One Week)</h3>
                <table>
                    <tr>
                        <th>Activity</th>
                        <th>Hours</th>
                    </tr>
                    <tr>
                        <td>Total Running</td>
                        <td><input type="number"></td>
                    </tr>
                    <tr>
                        <td>Total Cycling</td>
                        <td><input type="number"></td>
                    </tr>
                    <tr>
                        <td>Others</td>
                        <td><input type="number"></td>
                    </tr>
                </table>
            </div>
            <div class="table-column">
                <h3>Daily Affirmation</h3>
                <textarea placeholder="Enter your daily affirmation"></textarea>
            </div>
        </div>

        <button id = "submitBtn">Submit</button>

        

        <script src="scripts/Patient_Dashboard.js"></script>
    </div>
</body>
</html>
